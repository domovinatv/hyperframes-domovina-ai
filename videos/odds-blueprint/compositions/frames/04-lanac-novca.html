        const P = (a) => [CX + R * Math.cos(a * Math.PI / 180), CY + R * Math.sin(a * Math.PI / 180)];
        const arcs = [[239, 194], [166, 121], [59, 19], [-19, -59]];

          const p0 = P(ar[0]), p1 = P(ar[1]);

          const th = ar[1] * Math.PI / 180;
          const hd = Math.atan2(-Math.cos(th), Math.sin(th)) * 180 / Math.PI;
          document.getElementById("f04-h" + (i + 1)).setAttribute("transform", `translate(${p1[0].toFixed(1)} ${p1[1].toFixed(1)}) rotate(${hd.toFixed(1)})`);

        ["f04-a1", "f04-a2", "f04-a3", "f04-a4", "f04-a5"].forEach((id) => {
          const p = document.getElementById(id);
          const len = p.getTotalLength() * 1.02;
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        });

        // camera: single writer
        const cam = { s: 1.3, fx: 510, fy: 400 };
        const drift = { p: 0 };
        const world = document.getElementById("f04-world");
        function render() {
          const dx = Math.sin(drift.p) * 4, dy = Math.sin(drift.p * 1.3) * 2.5;
          const x = 960 - cam.fx * cam.s + dx, y = 490 - cam.fy * cam.s + dy;
          world.style.transform = `translate(${x}px, ${y}px) scale(${cam.s})`;
        }
        render();
        tl.to(drift, { p: Math.PI * 2, duration: 13, ease: "none", onUpdate: render }, 0);
        const move = (at, dur, o) => tl.to(cam, Object.assign({ duration: dur, ease: "power2.inOut", onUpdate: render }, o), at);
        move(2.5, 1.0, { fy: 620 });
        move(3.9, 1.0, { fx: 770 });
        move(6.0, 1.5, { s: 1, fx: 960, fy: 490 });

          tl.to("#" + id, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
          if (h) tl.to("#" + h, { opacity: 1, duration: 0.15, ease: "power1.out" }, at + dur - 0.05);

        const lbl = (id, at) => tl.fromTo("#" + id, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, at);
